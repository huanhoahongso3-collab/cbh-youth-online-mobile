name: Build Android APK (1.5.3)
on:
  push:
    branches: [v1.5.3-ci]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Regenerate native project (expo prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x android/gradlew
      - run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cbh-1.5.3-apk
          path: android/app/build/outputs/apk/release/*.apk
